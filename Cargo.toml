[package]
name = "fictty"
description = "A terminal UI that is one value: agents write it, rewrite it live and read it back"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/brancusi/fictty"
homepage = "https://fictty.com"
keywords = ["tui", "terminal", "agents", "declarative", "ratatui"]
categories = ["command-line-interface"]
publish = false

[[bin]]
name = "fictty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
caretline = "0.5"
caretline-layers = { version = "0.2.0", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
miniz_oxide = "0.8"
ratatui = "0.30"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
