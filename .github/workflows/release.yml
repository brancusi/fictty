# On a version tag (v0.1.0), build fictty for macOS and Linux and attach each as
# fictty-<target>.tar.gz to the release. https://fictty.com/try.sh downloads these, and builds
# from source on machines without one. Run it by hand with a tag to rebuild that tag's binaries.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build (it must exist)
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs are cross-built on Apple silicon: GitHub's Intel runners are gone.
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf fictty-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release fictty
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --notes "Try it: curl -fsSL https://fictty.com/try.sh | sh" || true
          gh release upload "$TAG" fictty-${{ matrix.target }}.tar.gz --clobber
